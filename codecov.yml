# Canonical Codecov configuration. Copied verbatim into the root of every repository under
# Packages/ and Experiments/ by harness workflows — edit this file and re-run the installer,
# never a copy in a repository.
#
# WHY THIS FILE HAS TO EXIST AT ALL.
#
# Without it Codecov's defaults apply: `target: auto` with `threshold: 0%`, which fails a pull
# request for *any* decrease. That is sharper than it reads, because Codecov counts a *modified*
# line as part of the diff — changing a signature's annotation, or splitting one into a method per
# shape, re-attributes lines that were already uncovered to whoever touched them. A pull request
# can report 13 missing lines on a net movement of 2, or a 0.24 % regression while its hit count
# goes *up* by 22 lines, because the denominator grows faster than the numerator.
#
# 1 % on both, so a real regression still fails and drift does not. `informational` is deliberately
# NOT set: the check should still be able to fail on genuinely untested methods.
#
# Coverage is instrumented and uploaded from a single matrix entry (see the COVERAGE expression in
# CI.yml). Where a repository has a second job whose tests reach code the main suite does not, that
# job uploads too and Codecov merges the reports, as an extra Symbolic.yml does.

coverage:
    status:
        project:
            default:
                target: auto
                threshold: 1%
        patch:
            default:
                target: auto
                threshold: 1%
