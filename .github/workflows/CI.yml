# Canonical CI workflow of the ResearchHarness. `harness workflows --apply` copies it verbatim into
# every package and experiment repository. Edit the template, githooks/workflows/CI.yml, and re-run
# the installer; never edit an installed copy.
#
# THIS FILE IS BYTE-IDENTICAL IN EVERY REPOSITORY. That is the whole point, and it is what
# verify-workflows.jl asserts. Nothing here is parameterised by the package: the jobs read the
# package name from Project.toml at run time, exactly as the git hooks do. A repository that needs
# an extra job gets its own extra workflow file, such as Symbolic.yml, rather than a local edit
# here.
#
# WHY THE VERSION MATRIX IS ALIASES AND NOT VERSION NUMBERS.
#
# A required status check is named after the job that produces it, so `Julia 1.12 - …` embeds a
# Julia version in the branch-protection configuration of every repository. Bumping a matrix then
# renames the checks and silently invalidates protection: the old names never report again, and
# every pull request sits permanently pending with no error shown anywhere.
#
# `min` resolves the lower bound of *this* package's `[compat] julia` entry and `1` the current
# stable release, so one identical matrix tests the right versions in every repository, whatever
# its floor. The check names therefore never change — not when a package raises its floor, and not
# when Julia releases. That is what lets harness ci-protection use one static list for every
# repository without test groups.
#
# WHICH ENTRIES RUN ON WHICH EVENT.
#
# `test` runs Ubuntu on `min` and `1` on every event. `test-other` runs macOS and Windows only
# after every entry of `test` has passed, so a red Ubuntu job starts no macOS or Windows runner.
# On a pull request and a push to a branch it runs `1` alone; on the weekly schedule, a tag, a
# run by hand and any other event it runs `min` and `1`. The `groups` job writes the matrix rows
# of both jobs from the event, each with its `version`, `os`, `arch`, `group` and test arguments
# `args`, and both jobs read them as the `include` of their matrix. The two jobs share one name,
# so their checks keep the names of a matrix over all three systems.
#
# `prerelease` runs `pre` and `nightly` on Ubuntu on every event, and is advisory
# (`continue-on-error`): a failure in an unreleased Julia is information, not a broken build. No job
# waits for it, and its checks are NOT required checks.
#
# The downgrade job, which tests the `[compat]` lower bounds, is a workflow of its own,
# Downgrade.yml, which runs only where those bounds can change.
#
# TEST GROUPS: ONE FILE PER REPOSITORY, NOT AN EDIT HERE.
#
# A suite too long for one job lists its groups in test/ci-groups.toml, `groups = ["core", ...]`,
# the groups of `runtests.jl` that an empty ARGS runs. The `groups` job reads that list, and the
# `test` and `test-other` jobs then run one job per group, with the group as the test argument and
# ` - <group>` at the end of the job name. Without the file each entry has one row with an empty
# group: the jobs run the whole suite, and their names are those of a repository without groups.
#
# Two optional keys of the file plan these jobs. `split = false` runs all groups of an entry in
# one job, with an empty group, so the names are those of a repository without groups; the job
# names its groups, joined by a space, as its test arguments, so an empty ARGS never adds a device
# group of `runtests.jl`. `once = [...]` names groups other than `core` that a pull request and a
# push to a branch run on Ubuntu with `1` alone; the other entries of such an event run the
# remaining groups. Every other event runs every group on every entry. harness ci-protection reads
# the same file for the required checks of a pull request, and verify-workflows.jl checks it
# against `runtests.jl`. The downgrade job runs every group, and `prerelease` runs the whole suite
# in one job either way.

name: CI

on:
    push:
        branches:
            - main
            - master
        tags: ["*"]
    pull_request:
    workflow_dispatch:
    # Weekly, Monday 03:17 UTC: the whole matrix. Off the full hour, which GitHub delays most.
    schedule:
        - cron: "17 3 * * 1"

concurrency:
    # Skip intermediate builds: always.
    # Cancel intermediate builds: only if it is a pull request build.
    # The event is part of the group: the weekly run and a push to `main` share the ref, and
    # GitHub keeps one pending run per group, so without it each would replace the other.
    group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
    cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
    groups:
        # The matrix rows of `test` and of `test-other` for this event, each a JSON list of tables
        # with the keys `version`, `os`, `arch`, `group` and `args`; and the test groups of the
        # downgrade job as a JSON list, `[""]` for one job of the whole suite.
        name: Test groups
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        outputs:
            test: ${{ steps.read.outputs.test }}
            other: ${{ steps.read.outputs.other }}
            list: ${{ steps.read.outputs.list }}
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: test/ci-groups.toml
                  sparse-checkout-cone-mode: false
                  persist-credentials: false
            - id: read
              shell: python
              run: |
                  import json, os, pathlib, re, tomllib
                  path = pathlib.Path("test/ci-groups.toml")
                  data = tomllib.loads(path.read_text()) if path.is_file() else {}
                  groups = data.get("groups") if path.is_file() else [""]
                  if path.is_file() and not (
                      isinstance(groups, list) and groups
                      and all(isinstance(g, str) and re.fullmatch("[a-z][a-z0-9]*", g) for g in groups)
                      and len(set(groups)) == len(groups)
                  ):
                      raise SystemExit(f"{path}: `groups` is not a list of distinct group names: {groups!r}")
                  # `split = false` runs all groups of an entry in one job; `once` names the groups
                  # that a pull request and a push to a branch run on Ubuntu with `1` alone.
                  split, once = data.get("split", True), data.get("once", [])
                  if not isinstance(split, bool):
                      raise SystemExit(f"{path}: `split` is not true or false")
                  if not (
                      isinstance(once, list)
                      and all(isinstance(g, str) and g in groups and g != "core" for g in once)
                      and len(set(once)) == len(once)
                  ):
                      raise SystemExit(f"{path}: `once` is not a list of distinct groups of `groups` other than core")
                  # macOS and Windows would run no group, or with `split = false` every group.
                  if len(once) == len(groups):
                      raise SystemExit(f"{path}: `once` holds every group of `groups`")
                  # A pull request and a push to a branch are short: macOS and Windows on `1` alone,
                  # and the groups of `once` on Ubuntu with `1` alone. A tag, the schedule, a run by
                  # hand and every other event run every group on `min` and `1`, so a new trigger
                  # never runs less.
                  event, ref = os.environ["GITHUB_EVENT_NAME"], os.environ["GITHUB_REF"]
                  short = event == "pull_request" or (event == "push" and ref.startswith("refs/heads/"))

                  def rows(entries):
                      found = []
                      for version, system in entries:
                          runs = groups
                          if short and (version, system) != ("1", "ubuntu-latest"):
                              runs = [g for g in groups if g not in once]
                          row = {"version": version, "os": system, "arch": "default"}
                          if split:
                              found += [row | {"group": g, "args": g} for g in runs]
                          else:
                              # One job that names its groups, every group too: an empty ARGS adds
                              # the device groups of the platform line of `runtests.jl`.
                              found.append(row | {"group": "", "args": " ".join(runs)})
                      return found

                  test = rows([("min", "ubuntu-latest"), ("1", "ubuntu-latest")])
                  versions = ["1"] if short else ["min", "1"]
                  other = rows([(v, s) for v in versions for s in ("macOS-latest", "windows-latest")])
                  listed = groups if split else [""]
                  print("test:", test, "other:", other, "list:", listed, sep="\n")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                      out.write(f"test={json.dumps(test)}\n")
                      out.write(f"other={json.dumps(other)}\n")
                      out.write(f"list={json.dumps(listed)}\n")

    test:
        # ` - <group>` only for a non-empty group, so a repository without test/ci-groups.toml
        # keeps the names of the required checks.
        name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}${{ matrix.group && format(' - {0}', matrix.group) || '' }}
        needs: groups
        runs-on: ${{ matrix.os }}
        timeout-minutes: 120
        permissions:
            # julia-actions/cache proactively deletes the caches it created.
            actions: write
            contents: read
        env:
            # Instrument and upload coverage in a single matrix entry only. Uploading from every
            # entry makes Codecov merge several reports of the same scope per run, and the merged
            # percentage then moves for reasons that are not code changes. The entry is `1`, not
            # `min`: instrumentation makes the job that carries the coverage the slowest of the
            # matrix, and `min` is already the slowest Julia. With one job per test group, the job of
            # each group uploads its own part of the suite, and Codecov merges the parts into one
            # report; with `split = false`, the one job of the entry uploads it all.
            COVERAGE: ${{ matrix.version == '1' && matrix.os == 'ubuntu-latest' }}
            # Two threads, everywhere: a runner has more than one core, and a suite with a threading
            # test is otherwise silently single-threaded.
            JULIA_NUM_THREADS: 2
        strategy:
            fail-fast: false
            matrix:
                # Ubuntu on `min` and `1`: the rows of the `groups` job.
                include: ${{ fromJSON(needs.groups.outputs.test) }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: julia-actions/setup-julia@v3
              with:
                  version: ${{ matrix.version }}
                  arch: ${{ matrix.arch }}
            - uses: julia-actions/cache@v3
              with:
                  # Save only from a job that succeeds. A cancelled or failed job saves a partial
                  # cache, the next run of the branch restores it, and that job then precompiles
                  # some 300 packages again.
                  save-always: false
            - uses: julia-actions/julia-buildpkg@v1
            - uses: julia-actions/julia-runtest@v1
              with:
                  # `auto`, not the action's default `yes`. A bounds check defeats `@inbounds`, so
                  # the local `MMatrix` and `MVector` of a static kernel escape to the heap, and a
                  # kernel that a compiled backend runs cannot allocate: with `yes`, every such
                  # testset throws `KernelException` on a host backend that compiles kernels. The
                  # pre-commit probes run with `auto` too.
                  check_bounds: auto
                  coverage: ${{ env.COVERAGE }}
                  test_args: ${{ matrix.args }}
            - uses: julia-actions/julia-processcoverage@v1
              if: env.COVERAGE == 'true'
            - uses: codecov/codecov-action@v7
              if: env.COVERAGE == 'true'
              with:
                  files: lcov.info
                  token: ${{ secrets.CODECOV_TOKEN }}
                  # A Codecov outage must not fail a merge.
                  fail_ci_if_error: false

    test-other:
        # macOS and Windows, with the name of `test`, so that their checks keep the names of the
        # required checks. `needs: test` keeps a red Ubuntu job from starting these runners; no
        # `if:` here may run them after a failure.
        name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}${{ matrix.group && format(' - {0}', matrix.group) || '' }}
        needs: [groups, test]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 120
        permissions:
            actions: write
            contents: read
        env:
            JULIA_NUM_THREADS: 2
        strategy:
            fail-fast: false
            matrix:
                # macOS and Windows on `1` on a pull request and a push to a branch, on `min` and
                # `1` on every other event: the rows of the `groups` job. Their `arch` is
                # 'default', the runner's native architecture, which is aarch64 on macOS-latest; a
                # hardcoded 'x64' would test Julia under Rosetta there.
                include: ${{ fromJSON(needs.groups.outputs.other) }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: julia-actions/setup-julia@v3
              with:
                  version: ${{ matrix.version }}
                  arch: ${{ matrix.arch }}
            - uses: julia-actions/cache@v3
              with:
                  # As in `test`: save only from a job that succeeds.
                  save-always: false
            - uses: julia-actions/julia-buildpkg@v1
            - uses: julia-actions/julia-runtest@v1
              with:
                  # The same `auto` as in `test`, and for the same reason.
                  check_bounds: auto
                  # The coverage comes from `test` alone.
                  coverage: false
                  test_args: ${{ matrix.args }}

    prerelease:
        # `pre` and `nightly` on Ubuntu, the whole suite in one job, on every event. A failure in
        # an unreleased Julia is information, not a broken build: the job continues on error, no job
        # waits for it, and harness ci-protection requires none of its checks. It has no group, so
        # its name has no group term.
        name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 120
        continue-on-error: true
        permissions:
            actions: write
            contents: read
        env:
            JULIA_NUM_THREADS: 2
        strategy:
            fail-fast: false
            matrix:
                version:
                    - "pre"
                    - "nightly"
                os:
                    - ubuntu-latest
                arch:
                    - default
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: julia-actions/setup-julia@v3
              with:
                  version: ${{ matrix.version }}
                  arch: ${{ matrix.arch }}
            - uses: julia-actions/cache@v3
              with:
                  # As in `test`: save only from a job that succeeds.
                  save-always: false
            - uses: julia-actions/julia-buildpkg@v1
            - uses: julia-actions/julia-runtest@v1
              with:
                  # The same `auto` as in `test`, and for the same reason.
                  check_bounds: auto
                  # The coverage comes from `test` alone.
                  coverage: false

    doctest:
        # Doctests run here rather than across the test matrix, and rather than only inside the
        # documentation build. Their output is sensitive to both the Julia version and the
        # architecture — the last ULP of an `ldiv!` result differs between x86_64 and aarch64 — so
        # running them on every matrix entry produces failures that are real but are not defects.
        # One pinned entry gives a required check that can be trusted.
        #
        # No coverage here: coverage measured from a doctest run is not a measure of the suite.
        name: Doctests - ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        permissions:
            actions: write
            contents: read
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: julia-actions/setup-julia@v3
              with:
                  version: "1"
            - uses: julia-actions/cache@v3
            - name: Instantiate the documentation environment
              run: |
                  if [ ! -f docs/Project.toml ]; then
                    echo "no docs/Project.toml in this repository - nothing to doctest"
                    exit 0
                  fi
                  julia --project=docs -e '
                    using Pkg
                    Pkg.develop(PackageSpec(path = pwd()))
                    Pkg.instantiate()'
            - name: Doctests
              run: |
                  if [ ! -f docs/Project.toml ]; then
                    echo "no docs/Project.toml in this repository - nothing to doctest"
                    exit 0
                  fi
                  julia --project=docs -e '
                    using TOML
                    using Documenter: DocMeta, doctest
                    name = Symbol(TOML.parsefile("Project.toml")["name"])
                    # `@eval using` at top level, never inside a function: a module loaded inside
                    # a compiled function is invisible to the world age of that function. The
                    # binding has to land in Main as well, because doctest() evaluates the
                    # `CurrentModule = X` of every manual page there.
                    @eval using $name
                    m = getfield(Main, name)
                    # A package whose doctests need more than its own exports in scope declares
                    # that in docs/doctestsetup.jl, which its docs/make.jl includes too - one
                    # definition, two callers: another package and two unexported names, say, or
                    # a submodule set up separately.
                    setup = joinpath("docs", "doctestsetup.jl")
                    if isfile(setup)
                        include(abspath(setup))
                    else
                        DocMeta.setdocmeta!(m, :DocTestSetup, :(using $name); recursive = true)
                    end
                    doctest(m)'
