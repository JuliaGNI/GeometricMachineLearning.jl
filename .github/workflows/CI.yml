# Canonical CI workflow. Copied verbatim into every repository under Packages/ and Experiments/
# by harness workflows — edit this file and re-run the installer, never a copy in a repository.
#
# THIS FILE IS BYTE-IDENTICAL IN EVERY REPOSITORY. That is the whole point, and it is what
# verify-workflows.jl asserts. Nothing here is parameterised by the package: the jobs read the
# package name from Project.toml at run time, exactly as the git hooks do. A repository that needs
# an extra job gets its own extra workflow file, such as Symbolic.yml, rather than a local edit
# here.
#
# WHY THE VERSION MATRIX IS ALIASES AND NOT VERSION NUMBERS.
#
# A required status check is named after the job that produces it, so `Julia 1.12 - …` embeds a
# Julia version in the branch-protection configuration of every repository. Bumping a matrix then
# renames the checks and silently invalidates protection: the old names never report again, and
# every pull request sits permanently pending with no error shown anywhere.
#
# `min` resolves the lower bound of *this* package's `[compat] julia` entry and `1` the current
# stable release, so one identical matrix still tests the right versions in a tree whose compat
# floors are 1.10, 1.11 and 1.12. The check names therefore never change — not when a package raises its
# floor, and not when Julia releases. That is what lets harness ci-protection use one static list.
#
# `pre` and `nightly` are advisory (`experimental: true` + `continue-on-error`): a failure in an
# unreleased Julia is information, not a broken build. They are deliberately NOT required checks.
#
# `downgrade` is advisory too, for a different reason: it tests the `[compat]` lower bounds, which
# no other job tests, so it is red wherever a floor is false. It becomes a required check only once
# it is green in every repository.

name: CI

on:
    push:
        branches:
            - main
            - master
        tags: ["*"]
    pull_request:
    workflow_dispatch:

concurrency:
    # Skip intermediate builds: always.
    # Cancel intermediate builds: only if it is a pull request build.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
    test:
        name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 120
        # A pre-release or nightly failure is information, not a broken build.
        continue-on-error: ${{ matrix.experimental }}
        permissions:
            # julia-actions/cache proactively deletes the caches it created.
            actions: write
            contents: read
        env:
            # Instrument and upload coverage in a single matrix entry only. Uploading from all six
            # makes Codecov merge six reports of the same scope per run, and the merged percentage
            # then moves for reasons that are not code changes. The entry is `1`, not `min`:
            # instrumentation makes the job that carries the coverage the slowest of the matrix,
            # and `min` is already the slowest Julia.
            COVERAGE: ${{ matrix.version == '1' && matrix.os == 'ubuntu-latest' }}
            # Two threads, everywhere: a runner has more than one core, and a suite with a threading
            # test is otherwise silently single-threaded.
            JULIA_NUM_THREADS: 2
        strategy:
            fail-fast: false
            matrix:
                version:
                    - "min"
                    - "1"
                os:
                    - ubuntu-latest
                    - macOS-latest
                    - windows-latest
                arch:
                    # 'default' is the runner's native architecture, which is aarch64 on
                    # macOS-latest; a hardcoded 'x64' would test Julia under Rosetta there.
                    - default
                experimental:
                    - false
                include:
                    - version: "pre"
                      os: ubuntu-latest
                      arch: default
                      experimental: true
                    - version: "nightly"
                      os: ubuntu-latest
                      arch: default
                      experimental: true
        steps:
            - uses: actions/checkout@v7
            - uses: julia-actions/setup-julia@v3
              with:
                  version: ${{ matrix.version }}
                  arch: ${{ matrix.arch }}
            - uses: julia-actions/cache@v3
              with:
                  # Save only from a job that succeeds. A cancelled or failed job saves a partial
                  # cache, the next run of the branch restores it, and that job then precompiles
                  # some 300 packages again.
                  save-always: false
            - uses: julia-actions/julia-buildpkg@v1
            - uses: julia-actions/julia-runtest@v1
              with:
                  coverage: ${{ env.COVERAGE }}
            - uses: julia-actions/julia-processcoverage@v1
              if: env.COVERAGE == 'true'
            - uses: codecov/codecov-action@v7
              if: env.COVERAGE == 'true'
              with:
                  files: lcov.info
                  token: ${{ secrets.CODECOV_TOKEN }}
                  # A Codecov outage must not fail a merge.
                  fail_ci_if_error: false

    downgrade:
        # The `[compat]` lower bounds. `min` tests the lowest Julia with the newest dependencies,
        # which leaves every dependency floor untested: a floor can name a version that cannot be
        # installed at all, or that conflicts with a sibling's floor, and nothing notices. This job
        # resolves every direct dependency of the root Project.toml to exactly its lower bound on
        # the lowest Julia, and `forcedeps` fails, naming the entry, when one cannot sit at its
        # bound. Then it runs the suite there, so a floor that installs but lacks something the
        # package calls fails too. `projects` is left at `.`, so the floors in test/Project.toml
        # and the test-only dependencies are not floor-tested.
        #
        # The stdlibs are skipped because their version is fixed by the Julia version. The list is
        # every stdlib a repository here depends on, and the common rest; add one when a
        # repository takes a stdlib that is not on it.
        name: Downgrade - ubuntu-latest
        runs-on: ubuntu-latest
        timeout-minutes: 120
        # Advisory: see the header.
        continue-on-error: true
        permissions:
            actions: write
            contents: read
        env:
            JULIA_NUM_THREADS: 2
        steps:
            - uses: actions/checkout@v7
            - uses: julia-actions/setup-julia@v3
              with:
                  version: min
            - uses: julia-actions/cache@v3
            - uses: julia-actions/julia-downgrade-compat@v2
              with:
                  mode: forcedeps
                  julia_version: min
                  skip: ArgTools,Artifacts,Base64,CRC32c,Dates,DelimitedFiles,Distributed,Downloads,FileWatching,Future,InteractiveUtils,LazyArtifacts,LibCURL,LibGit2,Libdl,LinearAlgebra,Logging,Markdown,Mmap,NetworkOptions,Pkg,Printf,Profile,REPL,Random,SHA,Serialization,SharedArrays,Sockets,SparseArrays,Statistics,TOML,Tar,Test,UUIDs,Unicode
            - uses: julia-actions/julia-buildpkg@v1
            - uses: julia-actions/julia-runtest@v1
              with:
                  # Keep the resolved floors: a re-resolve would move them back up, and the
                  # Dependabot default would force the newest version of the bumped entry.
                  allow_reresolve: false
                  force_latest_compatible_version: false

    doctest:
        # Doctests run here rather than across the test matrix, and rather than only inside the
        # documentation build. Their output is sensitive to both the Julia version and the
        # architecture — the last ULP of an `ldiv!` result differs between x86_64 and aarch64 — so
        # running them on every matrix entry produces failures that are real but are not defects.
        # One pinned entry gives a required check that can be trusted.
        #
        # No coverage here: coverage measured from a doctest run is not a measure of the suite.
        name: Doctests - ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        permissions:
            actions: write
            contents: read
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: julia-actions/setup-julia@v3
              with:
                  version: "1"
            - uses: julia-actions/cache@v3
            - name: Instantiate the documentation environment
              run: |
                  if [ ! -f docs/Project.toml ]; then
                    echo "no docs/Project.toml in this repository - nothing to doctest"
                    exit 0
                  fi
                  julia --project=docs -e '
                    using Pkg
                    Pkg.develop(PackageSpec(path = pwd()))
                    Pkg.instantiate()'
            - name: Doctests
              run: |
                  if [ ! -f docs/Project.toml ]; then
                    echo "no docs/Project.toml in this repository - nothing to doctest"
                    exit 0
                  fi
                  julia --project=docs -e '
                    using TOML
                    using Documenter: DocMeta, doctest
                    name = Symbol(TOML.parsefile("Project.toml")["name"])
                    # `@eval using` at top level, never inside a function: a module loaded inside
                    # a compiled function is invisible to the world age of that function. The
                    # binding has to land in Main as well, because doctest() evaluates the
                    # `CurrentModule = X` of every manual page there.
                    @eval using $name
                    m = getfield(Main, name)
                    # A package whose doctests need more than its own exports in scope declares
                    # that in docs/doctestsetup.jl, which its docs/make.jl includes too - one
                    # definition, two callers: another package and two unexported names, say, or
                    # a submodule set up separately.
                    setup = joinpath("docs", "doctestsetup.jl")
                    if isfile(setup)
                        include(abspath(setup))
                    else
                        DocMeta.setdocmeta!(m, :DocTestSetup, :(using $name); recursive = true)
                    end
                    doctest(m)'
