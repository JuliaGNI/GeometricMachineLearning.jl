name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

jobs:
  build:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install packages for generating tikz images
        run: |
          sudo apt-get install imagemagick
          sudo apt-get install poppler-utils
          sudo apt-get install texlive-xetex
          sudo apt-get install texlive-science
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - name: Install BrenierTwoFluid package
        run: |
          cd docs
          make install_brenier_two_fluid test_docs
          cd ..
      - name: Make tikz images
        run: make all -C docs/src/tikz
      - uses: julia-actions/julia-buildpkg@v1
      # Checks `@docs`/`@ref` resolution and `missing_docs` without building the pages. The full
      # build takes hours before it reports these, and they are the errors a docs change is most
      # likely to introduce, so run them first and fail fast.
      - name: Check docstring references
        run: julia --project=docs docs/check_references.jl
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}