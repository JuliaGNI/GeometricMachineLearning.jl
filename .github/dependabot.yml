# Canonical Dependabot configuration. Copied verbatim to .github/dependabot.yml in every repository
# under Packages/ and Experiments/ by harness workflows — edit this file and re-run the installer,
# never a copy in a repository. Byte-identical in every repository; verify-workflows.jl asserts it.
#
# Julia only. The actions the workflows pin are bumped here, in the canonical workflows: a
# github-actions update would edit one installed copy and make it drift from the template.
#
# Only the root Project.toml is updated. test/Project.toml and docs/Project.toml carry no [compat]
# entry for a dependency of the root: those environments contain the package, so the resolver
# applies the root's bounds, and `test-layout.jl --check` reports a shared entry there. A shared
# bound moves in the root only, and a dependency that only the test or docs environment uses gets
# no automated bump. The standard libraries are ignored because their bound stays at "1":
# Dependabot pins them to the minor of the Julia it runs, which breaks the `min` job of a package
# with a 1.10 floor. The list is every non-JLL stdlib of Julia 1.10 to 1.13.

version: 2
updates:
  - package-ecosystem: "julia"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "ArgTools"
      - dependency-name: "Artifacts"
      - dependency-name: "Base64"
      - dependency-name: "CRC32c"
      - dependency-name: "Dates"
      - dependency-name: "DelimitedFiles"
      - dependency-name: "Distributed"
      - dependency-name: "Downloads"
      - dependency-name: "FileWatching"
      - dependency-name: "Future"
      - dependency-name: "InteractiveUtils"
      - dependency-name: "JuliaSyntaxHighlighting"
      - dependency-name: "LazyArtifacts"
      - dependency-name: "LibCURL"
      - dependency-name: "LibGit2"
      - dependency-name: "Libdl"
      - dependency-name: "LinearAlgebra"
      - dependency-name: "Logging"
      - dependency-name: "Markdown"
      - dependency-name: "Mmap"
      - dependency-name: "NetworkOptions"
      - dependency-name: "Pkg"
      - dependency-name: "Printf"
      - dependency-name: "Profile"
      - dependency-name: "REPL"
      - dependency-name: "Random"
      - dependency-name: "SHA"
      - dependency-name: "Serialization"
      - dependency-name: "SharedArrays"
      - dependency-name: "Sockets"
      - dependency-name: "SparseArrays"
      - dependency-name: "Statistics"
      - dependency-name: "StyledStrings"
      - dependency-name: "SuiteSparse"
      - dependency-name: "TOML"
      - dependency-name: "Tar"
      - dependency-name: "Test"
      - dependency-name: "UUIDs"
      - dependency-name: "Unicode"
